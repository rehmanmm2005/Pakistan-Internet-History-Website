<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Digital economy and freelancing</title>
  <desc id="desc">Stylised illustration of a laptop displaying an upward earnings graph, next to a globe representing global freelance work.</desc>
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C7293"/>
      <stop offset="100%" stop-color="#0B1F3A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bgGrad4)"/>

  <!-- laptop -->
  <g transform="translate(70,80)">
    <path d="M0,60 L10,60 L100,60 L110,60 L100,72 L10,72 Z" fill="#F5F7FA"/>
    <rect x="10" y="0" width="90" height="60" rx="3" fill="#F5F7FA"/>
    <rect x="15" y="5" width="80" height="50" fill="#0B1F3A"/>
    <!-- upward graph on screen -->
    <polyline points="20,50 35,38 50,42 65,25 80,30 90,15" fill="none" stroke="#00C2CB" stroke-width="3"/>
    <circle cx="90" cy="15" r="3" fill="#00C2CB"/>
  </g>

  <!-- globe -->
  <g transform="translate(250,50)">
    <circle cx="45" cy="45" r="45" fill="none" stroke="#F5F7FA" stroke-width="3"/>
    <ellipse cx="45" cy="45" rx="20" ry="45" fill="none" stroke="#F5F7FA" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="45" x2="90" y2="45" stroke="#F5F7FA" stroke-width="2" opacity="0.7"/>
    <line x1="8" y1="22" x2="82" y2="22" stroke="#F5F7FA" stroke-width="1.5" opacity="0.5"/>
    <line x1="8" y1="68" x2="82" y2="68" stroke="#F5F7FA" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- floating coin -->
  <circle cx="200" cy="40" r="14" fill="#E4572E"/>
  <text x="200" y="45" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#F5F7FA">$</text>

  <text x="200" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#B9C7D6">FREELANCE &amp; REMOTE WORK</text>
</svg>
