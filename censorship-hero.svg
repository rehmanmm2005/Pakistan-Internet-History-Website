<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Blocked access symbol</title>
  <desc id="desc">Stylised illustration of a speech bubble and a padlock, symbolising restricted communication and platform access.</desc>
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C7293"/>
      <stop offset="100%" stop-color="#0B1F3A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bgGrad3)"/>

  <!-- speech bubble -->
  <g transform="translate(120,60)">
    <path d="M0,10 a10,10 0 0 1 10,-10 h80 a10,10 0 0 1 10,10 v50 a10,10 0 0 1 -10,10 h-55 l-15,15 v-15 h-10 a10,10 0 0 1 -10,-10 z"
          fill="#F5F7FA"/>
    <circle cx="25" cy="35" r="5" fill="#1C7293"/>
    <circle cx="50" cy="35" r="5" fill="#1C7293"/>
    <circle cx="75" cy="35" r="5" fill="#1C7293"/>
  </g>

  <!-- blocked circle-slash overlay -->
  <circle cx="170" cy="90" r="55" fill="none" stroke="#E4572E" stroke-width="6"/>
  <line x1="132" y1="128" x2="208" y2="52" stroke="#E4572E" stroke-width="6"/>

  <!-- padlock -->
  <g transform="translate(260,80)">
    <rect x="0" y="20" width="46" height="34" rx="4" fill="#F5F7FA"/>
    <path d="M8,20 v-10 a15,15 0 0 1 30,0 v10" fill="none" stroke="#F5F7FA" stroke-width="5"/>
    <circle cx="23" cy="37" r="5" fill="#0B1F3A"/>
    <rect x="21" y="40" width="4" height="8" fill="#0B1F3A"/>
  </g>

  <text x="200" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#B9C7D6">ACCESS &amp; RESTRICTION</text>
</svg>
